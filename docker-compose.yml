services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bermudez_b2b}
      POSTGRES_USER: ${POSTGRES_USER:-bermudez}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esta_clave}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bermudez} -d ${POSTGRES_DB:-bermudez_b2b}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bermudez}:${POSTGRES_PASSWORD:-cambia_esta_clave}@db:5432/${POSTGRES_DB:-bermudez_b2b}
      JWT_SECRET: ${JWT_SECRET:-desarrollo_local_cambiar}
      SEED_PRODUCTS: ${SEED_PRODUCTS:-15000}
      SEED_CUSTOMERS: ${SEED_CUSTOMERS:-100}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SQLSERVER_HOST: ${SQLSERVER_HOST:-}
      SQLSERVER_PORT: ${SQLSERVER_PORT:-1433}
      SQLSERVER_DATABASE: ${SQLSERVER_DATABASE:-}
      SQLSERVER_USER: ${SQLSERVER_USER:-}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:-}
      SQLSERVER_IMAGE_SCHEMA: ${SQLSERVER_IMAGE_SCHEMA:-dbo}
      SQLSERVER_IMAGE_TABLE: ${SQLSERVER_IMAGE_TABLE:-imagenes}
      SQLSERVER_IMAGE_KEY_COLUMN: ${SQLSERVER_IMAGE_KEY_COLUMN:-CodigoArticulo}
      SQLSERVER_IMAGE_COLUMN: ${SQLSERVER_IMAGE_COLUMN:-imagen}
      SQLSERVER_STOCK_SCHEMA: ${SQLSERVER_STOCK_SCHEMA:-dbo}
      SQLSERVER_STOCK_TABLE: ${SQLSERVER_STOCK_TABLE:-tempstockarticulo}
      SQLSERVER_STOCK_ARTICLE_COLUMN: ${SQLSERVER_STOCK_ARTICLE_COLUMN:-CodigoArticulo}
      SQLSERVER_STOCK_WAREHOUSE_COLUMN: ${SQLSERVER_STOCK_WAREHOUSE_COLUMN:-CodigoAlmacen}
      SQLSERVER_STOCK_UNITS_COLUMN: ${SQLSERVER_STOCK_UNITS_COLUMN:-UnidadesSaldo}
      SQLSERVER_WAREHOUSES_SCHEMA: ${SQLSERVER_WAREHOUSES_SCHEMA:-dbo}
      SQLSERVER_WAREHOUSES_TABLE: ${SQLSERVER_WAREHOUSES_TABLE:-almacenes}
      SQLSERVER_WAREHOUSES_CODE_COLUMN: ${SQLSERVER_WAREHOUSES_CODE_COLUMN:-CodigoAlmacen}
      SQLSERVER_WAREHOUSES_DESCRIPTION_COLUMN: ${SQLSERVER_WAREHOUSES_DESCRIPTION_COLUMN:-Almacen}
      SQLSERVER_STOCK_EXCLUDED_WAREHOUSES: ${SQLSERVER_STOCK_EXCLUDED_WAREHOUSES:-97,98}
      SQLSERVER_ARTICLES_SCHEMA: ${SQLSERVER_ARTICLES_SCHEMA:-dbo}
      SQLSERVER_ARTICLES_TABLE: ${SQLSERVER_ARTICLES_TABLE:-articulos}
      SQLSERVER_ARTICLES_CODE_COLUMN: ${SQLSERVER_ARTICLES_CODE_COLUMN:-CodigoArticulo}
      SQLSERVER_PRICE_WITH_TAX_COLUMN: ${SQLSERVER_PRICE_WITH_TAX_COLUMN:-PrecioVentaConIVA0}
      SQLSERVER_PRICE_WITHOUT_TAX_COLUMN: ${SQLSERVER_PRICE_WITHOUT_TAX_COLUMN:-PrecioVentaSinIVA0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
