<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-label="Revisa antes de enviar"><rect width="1000" height="410" rx="20" fill="#eef5f8"/><rect width="1000" height="85" rx="20" fill="#195b87"/><text x="30" y="52" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="bold">Revisa antes de enviar</text><rect x="24" y="110" width="952" height="72" rx="12" fill="white"/><circle cx="60" cy="146" r="23" fill="#195b87"/><text x="60" y="154" text-anchor="middle" fill="white" font-family="Arial" font-size="24" font-weight="bold">1</text><text x="105" y="139" fill="#153e5a" font-family="Arial" font-size="22" font-weight="bold">Tu pedido</text><text x="105" y="165" fill="#516a7a" font-family="Arial" font-size="19">Revisa artículos, cantidades y total con IVA.</text><rect x="24" y="195" width="952" height="72" rx="12" fill="white"/><circle cx="60" cy="231" r="23" fill="#195b87"/><text x="60" y="239" text-anchor="middle" fill="white" font-family="Arial" font-size="24" font-weight="bold">2</text><text x="105" y="224" fill="#153e5a" font-family="Arial" font-size="22" font-weight="bold">Recoger en</text><text x="105" y="250" fill="#516a7a" font-family="Arial" font-size="19">Selecciona tienda, obra y referencia.</text><rect x="24" y="280" width="952" height="72" rx="12" fill="white"/><circle cx="60" cy="316" r="23" fill="#195b87"/><text x="60" y="324" text-anchor="middle" fill="white" font-family="Arial" font-size="24" font-weight="bold">3</text><text x="105" y="309" fill="#153e5a" font-family="Arial" font-size="22" font-weight="bold">Enviar o guardar</text><text x="105" y="335" fill="#516a7a" font-family="Arial" font-size="19">Envía a tienda o guarda como borrador.</text><text x="30" y="395" fill="#627581" font-family="Arial" font-size="14">Guía visual · Los ejemplos explican el uso; no son capturas de una cuenta real.</text></svg>