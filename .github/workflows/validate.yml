name: Validar Web B2B

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          DATABASE_URL: sqlite+pysqlite:///./test.db
          SEED_PRODUCTS: "300"
          SEED_CUSTOMERS: "5"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar ambiente de desarrollo
        run: docker compose --project-name webb2b-dev --env-file .env.development.example -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - name: Validar ambiente de producción
        run: docker compose --project-name webb2b-prod --env-file .env.production.example -f docker-compose.yml -f docker-compose.prod.yml config --quiet
